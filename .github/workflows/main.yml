name: Sync Docker Images to Aliyun ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Aliyun ACR
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login \
            crpi-xq5y41gnxzuvamqf.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "${{ secrets.ALIYUN_REGISTRY_USER }}" \
            --password-stdin

      - name: Sync images
        run: |
          set -e

          REGISTRY="crpi-xq5y41gnxzuvamqf.cn-hangzhou.personal.cr.aliyuncs.com"
          NAMESPACE="docker-lxm"

          while read -r image; do
            image="$(echo "$image" | xargs)"
            [ -z "$image" ] && continue

            echo "=============================="
            echo "📦 Source : $image"

            # normalize
            normalized="${image#docker.io/}"
            normalized="${normalized#library/}"

            if [[ "$normalized" == *":"* ]]; then
              image_path="${normalized%:*}"
              image_tag="${normalized##*:}"
            else
              image_path="$normalized"
              image_tag="latest"
            fi

            repo_name="$(echo "$image_path" | tr '/' '_')"
            target="${REGISTRY}/${NAMESPACE}/${repo_name}:${image_tag}"

            echo "🎯 Target : $target"

            echo "⬇️  docker pull"
            docker pull "$image"

            echo "🏷  docker tag"
            docker tag "$image" "$target"

            echo "⬆️  docker push"
            docker push "$target"

            echo "✅ Done : $target"
          done < images.txt
