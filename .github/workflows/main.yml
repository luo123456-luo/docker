name: Sync Docker Images to Tencent Cloud TCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Tencent Cloud TCR
        run: |
          set -e
          echo "🔐 Login Tencent Cloud TCR"
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | \
            docker login ccr.ccs.tencentyun.com \
              --username "${{ secrets.ALIYUN_REGISTRY_USER }}" \
              --password-stdin
          echo "✅ Login success"

      - name: Pull / Tag / Push images (parallel + retry)
        run: |
          set -euo pipefail

          MAX_RETRY=3
          PARALLEL_JOBS=4
          NAMESPACE="docker-lxm"

          echo "⚙️  Max retry      : $MAX_RETRY"
          echo "⚙️  Parallel jobs : $PARALLEL_JOBS"
          echo "⚙️  Namespace     : $NAMESPACE"
          echo "----------------------------------------"

          process_image() {
            local raw_image="$1"

            image="$(echo "$raw_image" | tr -d '\r' | xargs)"
            [[ -z "$image" ]] && return 0

            echo ""
            echo "📦 Processing: $image"

            # ---------- normalize ----------
            normalized="${image#docker.io/}"
            normalized="${normalized#library/}"

            # ---------- split name / tag ----------
            if [[ "$normalized" == *":"* ]]; then
              image_path="${normalized%:*}"
              image_tag="${normalized##*:}"
            else
              image_path="$normalized"
              image_tag="latest"
            fi

            if [[ -z "$image_path" || -z "$image_tag" ]]; then
              echo "❌ Invalid image parsed"
              return 1
            fi

            # ---------- flatten repo ----------
            repo_name="$(echo "$image_path" | tr '/' '_' | tr ':' '_')"

            target="ccr.ccs.tencentyun.com/${NAMESPACE}/${repo_name}:${image_tag}"

            echo "🎯 Target image: $target"

            # ---------- pull retry ----------
            for ((i=1;i<=MAX_RETRY;i++)); do
              echo "⬇️  Pull attempt $i/$MAX_RETRY"
              if docker pull "$image"; then
                break
              fi
              [[ $i -eq $MAX_RETRY ]] && {
                echo "❌ Pull failed after $MAX_RETRY attempts"
                return 1
              }
              sleep 3
            done

            # ---------- tag ----------
            if ! docker tag "$image" "$target"; then
              echo "❌ Tag failed"
              return 1
            fi

            # ---------- push retry ----------
            for ((i=1;i<=MAX_RETRY;i++)); do
              echo "⬆️  Push attempt $i/$MAX_RETRY"
              if docker push "$target"; then
                break
              fi
              [[ $i -eq $MAX_RETRY ]] && {
                echo "❌ Push failed after $MAX_RETRY attempts"
                return 1
              }
              sleep 3
            done

            echo "✅ SUCCESS: $target"
          }

          export -f process_image
          export MAX_RETRY
          export NAMESPACE

          # ---------- parallel run ----------
          grep -v '^\s*$' images.txt | parallel -j "$PARALLEL_JOBS" process_image

      - name: Check result
        if: failure()
        run: |
          echo "❌ Some images failed after all retries"
          exit 1
