name: Sync Docker Images to Tencent Cloud TCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Tencent Cloud TCR
        run: |
          set -e
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | \
            docker login ccr.ccs.tencentyun.com \
              --username "${{ secrets.ALIYUN_REGISTRY_USER }}" \
              --password-stdin

      - name: Sync images (observable + retry)
        run: |
          set -euo pipefail

          MAX_RETRY=3
          MAX_CONCURRENT=3
          NAMESPACE="docker-lxm"

          echo "⚙️ MAX_RETRY=$MAX_RETRY"
          echo "⚙️ MAX_CONCURRENT=$MAX_CONCURRENT"
          echo "⚙️ NAMESPACE=$NAMESPACE"
          echo "------------------------------------"

          running=0
          pids=()

          log() {
            echo "[$(date '+%H:%M:%S')] $1"
          }

          process_image() {
            local image="$1"
            log "▶ START $image"

            normalized="${image#docker.io/}"
            normalized="${normalized#library/}"

            if [[ "$normalized" == *":"* ]]; then
              path="${normalized%:*}"
              tag="${normalized##*:}"
            else
              path="$normalized"
              tag="latest"
            fi

            repo="$(echo "$path" | tr '/' '_' )"
            target="ccr.ccs.tencentyun.com/${NAMESPACE}/${repo}:${tag}"

            log "🎯 TARGET $target"

            for ((i=1;i<=MAX_RETRY;i++)); do
              log "⬇️  [$image] pull attempt $i"
              docker pull "$image" && break
              [[ $i -eq $MAX_RETRY ]] && { log "❌ pull failed"; return 1; }
              sleep 5
            done

            docker tag "$image" "$target"

            for ((i=1;i<=MAX_RETRY;i++)); do
              log "⬆️  [$image] push attempt $i"
              docker push "$target" && break
              [[ $i -eq $MAX_RETRY ]] && { log "❌ push failed"; return 1; }
              sleep 5
            done

            log "✅ DONE $image"
          }

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            img="$(echo "$raw" | tr -d '\r' | xargs)"
            [[ -z "$img" ]] && continue

            process_image "$img" &
            pids+=($!)
            running=$((running+1))

            if [[ $running -ge $MAX_CONCURRENT ]]; then
              wait -n
              running=$((running-1))
            fi
          done < images.txt

          wait
          log "🎉 ALL DONE"
