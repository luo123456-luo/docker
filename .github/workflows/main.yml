name: Sync Docker Images to Tencent Cloud TCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Tencent Cloud TCR
        run: |
          set -e
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | \
            docker login ccr.ccs.tencentyun.com \
              --username "${{ secrets.ALIYUN_REGISTRY_USER }}" \
              --password-stdin

      - name: Pull / Tag / Push images (parallel + retry)
        run: |
          set -euo pipefail

          MAX_RETRY=3
          PARALLEL_JOBS=4

          echo "🚀 Max retry      : $MAX_RETRY"
          echo "🚀 Parallel jobs : $PARALLEL_JOBS"
          echo "-----------------------------------"

          process_image() {
            local raw_image="$1"

            image="$(echo "$raw_image" | tr -d '\r' | xargs)"
            [[ -z "$image" ]] && return 0

            echo "📦 Processing: $image"

            # normalize
            normalized="${image#docker.io/}"
            normalized="${normalized#library/}"

            if [[ "$normalized" == *":"* ]]; then
              image_name="${normalized%:*}"
              image_tag="${normalized##*:}"
            else
              image_name="$normalized"
              image_tag="latest"
            fi

            target="ccr.ccs.tencentyun.com/docker-lxm/docker/${image_name}:${image_tag}"

            echo "🎯 Target: $target"

            # pull retry
            for i in $(seq 1 $MAX_RETRY); do
              echo "⬇️  Pull attempt $i/$MAX_RETRY"
              docker pull "$image" && break
              [[ $i -eq $MAX_RETRY ]] && return 1
              sleep 3
            done

            # tag
            docker tag "$image" "$target" || return 1

            # push retry
            for i in $(seq 1 $MAX_RETRY); do
              echo "⬆️  Push attempt $i/$MAX_RETRY"
              docker push "$target" && break
              [[ $i -eq $MAX_RETRY ]] && return 1
              sleep 3
            done

            echo "✅ DONE: $target"
          }

          export -f process_image
          export MAX_RETRY

          # 并行执行
          grep -v '^\s*$' images.txt | parallel -j $PARALLEL_JOBS process_image

      - name: Fail if any image failed
        if: failure()
        run: |
          echo "❌ Some images failed after retries"
          exit 1
